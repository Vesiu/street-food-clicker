<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Food Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="game-container">
    <header>
      <h1>Street Food Clicker</h1>
      <p class="subtitle">Monde 1 : Le stand de rue</p>
    </header>

    <section class="score-board">
      <div>
        <span id="money-display">0</span> <span class="currency">€</span>
      </div>
      <p id="cps-display" class="cps-text">+0 € / sec</p>
    </section>

    <!-- Vitrine visuelle -->
    <section class="stand-showcase" id="stand-showcase">
      <div class="countertop">
        <div class="equipment-slot" id="slot-sauce" title="Distributeur de sauces"></div>
        <div class="main-station" id="station-fryer">
          <div class="fryer-pot">
            <span class="bubble b1"></span>
            <span class="bubble b2"></span>
            <span class="fry-basket">🍟</span>
          </div>
        </div>
        <div class="equipment-slot" id="slot-cutter" title="Coupe-frites"></div>
      </div>
      <div class="staff-slot" id="slot-student"></div>
    </section>

    <!-- Bouton d'action unique -->
    <section class="action-zone">
      <button id="serve-btn" type="button">🍟 Servir une portion</button>
    </section>

    <section class="upgrades-zone">
      <h2>Boutique d'améliorations</h2>
      <div id="shop-upgrades-list" class="shop-upgrades-list"></div>
    </section>

    <section class="upgrades-zone">
      <h2>Équipements passifs</h2>
      <div id="producers-list" class="producers-list"></div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
